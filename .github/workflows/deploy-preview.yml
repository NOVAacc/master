name: Deploy preview to Fornex
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: master-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Upload preview to isolated FTP root
        env:
          FTP_USER: ${{ secrets.MASTER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.MASTER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          test -s preview/index.html
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          timeout 45s lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 ftp://hostch01.fornex.org <<'EOF' > /tmp/preview-root.txt
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          cd /
          cls -a -1
          bye
          EOF
          if grep -Fxq index.php /tmp/preview-root.txt; then
            echo "::error::Server application is active; use Deploy Master application"
            exit 1
          fi
          timeout 90s lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 ftp://hostch01.fornex.org <<'EOF'
          set cmd:fail-exit true
          set net:timeout 15
          set net:max-retries 1
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          cd /
          put preview/index.html -o index.html
          get index.html -o /tmp/master-uploaded.html
          bye
          EOF
          cmp preview/index.html /tmp/master-uploaded.html
      - name: Verify public website matches this deployment
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            "https://edu.china.kg/?deploy=$GITHUB_SHA" -o /tmp/master-public.html
          if grep -qi 'Index of /' /tmp/master-public.html; then
            echo "::error::The domain still serves a directory listing"
            exit 1
          fi
          cmp preview/index.html /tmp/master-public.html
