name: Deploy preview to JAZ
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect FTPS certificate names
        env:
          FTP_HOST: ${{ secrets.MASTER_FTP_HOST }}
        run: |
          set -euo pipefail
          echo "Checking the FTPS certificate presented on port 21"
          timeout 20s openssl s_client -starttls ftp -connect "hostch01.fornex.org:21" -servername "hostch01.fornex.org" -showcerts </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -ext subjectAltName
      - name: Upload preview over FTPS
        env:
          FTP_HOST: ${{ secrets.MASTER_FTP_HOST }}
          FTP_USER: ${{ secrets.MASTER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.MASTER_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.MASTER_FTP_DIR }}
        run: |
          set -euo pipefail
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_DIR"
          # Fornex FTPS TLS certificate is issued to hostch01.fornex.org
          # FTP_USER must be the complete FTP account name, including @host
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          timeout 90s lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "ftp://hostch01.fornex.org" <<EOF
          set net:timeout 15
          set net:max-retries 1
          set net:reconnect-interval-base 2
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          cd "$FTP_DIR"
          put preview/index.html -o index.html
          bye
          EOF
