name: Deploy preview to JAZ
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Upload preview over FTPS
        env:
          FTP_HOST: ${{ secrets.MASTER_FTP_HOST }}
          FTP_USER: ${{ secrets.MASTER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.MASTER_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.MASTER_FTP_DIR }}
        run: |
          set -euo pipefail
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_DIR"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          timeout 90s lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "ftp://$FTP_HOST" <<EOF
          set net:timeout 15
          set net:max-retries 1
          set net:reconnect-interval-base 2
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          cd "$FTP_DIR"
          put preview/index.html -o index.html
          bye
          EOF
