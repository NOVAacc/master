name: Verify email resend hotfix deployment
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read recent main deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/runs?branch=main&per_page=12" --jq '.workflow_runs[] | [.id,.name,.status,.conclusion,.head_sha] | @tsv'
          for endpoint in / /login /up; do
            CODE=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "https://bosh.kg$endpoint")
            echo "BOSH endpoint $endpoint status $CODE"
          done
