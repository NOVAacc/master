name: Diagnose schedule persistence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-schedule.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_USER: ${{ secrets.MASTER_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.MASTER_FTP_PASSWORD }}
    steps:
      - name: Prepare isolated HTTP test and scoped cleanup
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          echo "PROBE=master-cleanup-$(openssl rand -hex 16).php" >> "$GITHUB_ENV"
          cat > /tmp/test-schedule.py <<'PY'
          import urllib.request,urllib.error,http.cookiejar,urllib.parse,json,os,secrets
          base='https://edu.china.kg'
          jar=http.cookiejar.CookieJar()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**kw): return None
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar),NoRedirect())
          def call(path,data=None,method='GET'):
              headers={'X-Inertia':'true','X-Requested-With':'XMLHttpRequest','Accept':'text/html,application/xhtml+xml','Referer':base+'/dashboard'}
              for c in jar:
                  if c.name=='XSRF-TOKEN':headers['X-XSRF-TOKEN']=urllib.parse.unquote(c.value)
              if data is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request(base+path,data=json.dumps(data).encode() if data is not None else None,headers=headers,method=method)
              try:
                  with opener.open(req,timeout=30) as r:return r.status,r.headers,r.read()
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read()
          marker=secrets.token_hex(10)
          email='master-check-'+marker+'@example.test'
          slug='master-check-'+marker
          password=secrets.token_urlsafe(24)
          # Credentials stay local to this job; cleanup is limited to this exact synthetic account.
          open('/tmp/test-identity.json','w').write(json.dumps({'email':email,'slug':slug}))
          call('/register')
          code,_,_=call('/register',{'name':'Проверка расписания','email':email,'slug':slug,'password':password,'password_confirmation':password},'POST')
          print('Registration response:',code)
          if code not in (302,303):raise RuntimeError('Test registration failed')
          code,_,body=call('/dashboard')
          page=json.loads(body)
          print('Dashboard component:',page.get('component'))
          hours=[{'weekday':1,'starts_at':'09:00','ends_at':'18:00'},{'weekday':2,'starts_at':'10:00','ends_at':'19:00'}]
          code,headers,body=call('/schedule',{'hours':hours},'PUT')
          print('Schedule PUT response:',code,'content-type:',headers.get('Content-Type'))
          code,_,body=call('/dashboard')
          page=json.loads(body)
          print('Saved rows:',len(page.get('props',{}).get('hours',[])))
          print('Validation errors:',page.get('props',{}).get('errors',{}))
          print('Success notice:',page.get('props',{}).get('flash',{}).get('success'))
          PY
          cat > /tmp/cleanup.php <<'PHP'
          <?php
          ini_set('display_errors','0');
          header('Content-Type: application/json');
          if(($_SERVER['REQUEST_METHOD']??'')!=='POST'||!hash_equals('__TOKEN_HASH__',hash('sha256',$_SERVER['HTTP_X_MASTER_CHECK']??''))){http_response_code(403);exit;}
          $base='/home/n66843/master-app/current';
          require $base.'/vendor/autoload.php';
          $app=require $base.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $input=json_decode(file_get_contents('php://input'),true);
          $email=$input['email']??'';$slug=$input['slug']??'';
          if(!preg_match('/^master-check-[a-f0-9]{20}@example[.]test$/',$email)||!preg_match('/^master-check-[a-f0-9]{20}$/',$slug)){http_response_code(422);exit;}
          $user=App\Models\User::where('email',$email)->where('name','Проверка расписания')->where('created_at','>=',now()->subMinutes(15))->first();
          if($user && App\Models\MasterProfile::where('user_id',$user->id)->where('slug',$slug)->exists())$user->delete();
          echo '{"test_account_removed":true}';
          PHP
          python3 - <<'PY'
          import secrets,hashlib
          p='/tmp/cleanup.php'
          token=secrets.token_hex(32)
          s=open(p).read().replace('__TOKEN_HASH__',hashlib.sha256(token.encode()).hexdigest())
          open(p,'w').write(s)
          open('/tmp/check-header.txt','w').write('X-Master-Check: '+token)
          PY
      - name: Upload scoped cleanup endpoint
        run: |
          set -euo pipefail
          timeout 60s lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://hostch01.fornex.org:21 <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          cd /
          put /tmp/cleanup.php -o $PROBE
          bye
          EOF
      - name: Reproduce save over real HTTPS
        run: python3 /tmp/test-schedule.py
      - name: Remove only the synthetic test account
        if: always()
        run: |
          set -euo pipefail
          if test -f /tmp/test-identity.json; then
            curl --fail --silent --show-error --max-time 30 -H @/tmp/check-header.txt \
              -H 'Content-Type: application/json' --data-binary @/tmp/test-identity.json "https://edu.china.kg/$PROBE"
          fi
      - name: Remove temporary cleanup endpoint
        if: always() && env.PROBE != ''
        run: |
          set -euo pipefail
          timeout 45s lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://hostch01.fornex.org:21 <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          cd /
          rm -f $PROBE
          bye
          EOF
