name: Verify live schedule save
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: master-live-schedule-test
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_USER: ${{ secrets.MASTER_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.MASTER_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare scoped cleanup endpoint
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          echo "PROBE=master-cleanup-$(openssl rand -hex 16).php" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import secrets, hashlib, time
          from pathlib import Path
          token = secrets.token_hex(32)
          text = Path('.github/scripts/cleanup-live-check.php.template').read_text()
          text = text.replace('__TOKEN_HASH__', hashlib.sha256(token.encode()).hexdigest()).replace('__EXPIRES__', str(int(time.time())+600))
          Path('/tmp/cleanup.php').write_text(text)
          Path('/tmp/check-header.txt').write_text('X-Master-Check: '+token)
          PY
      - name: Upload scoped cleanup endpoint
        run: |
          set -euo pipefail
          timeout 60s lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://hostch01.fornex.org:21 <<EOF
          set cmd:fail-exit true
          set net:timeout 10
          set net:max-retries 1
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          cd /
          put /tmp/cleanup.php -o $PROBE
          bye
          EOF
      - name: Save, reload, edit and clear schedule through HTTPS
        run: python3 .github/scripts/check-live-schedule.py
      - name: Remove only the synthetic test account
        if: always()
        run: |
          set -euo pipefail
          if test -f /tmp/test-identity.json; then
            curl --fail --silent --show-error --max-time 30 -H @/tmp/check-header.txt \
              -H 'Content-Type: application/json' --data-binary @/tmp/test-identity.json "https://edu.china.kg/$PROBE"
          fi
      - name: Remove temporary cleanup endpoint
        if: always() && env.PROBE != ''
        run: |
          set -euo pipefail
          timeout 45s lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://hostch01.fornex.org:21 <<EOF
          set cmd:fail-exit true
          set net:timeout 10
          set net:max-retries 1
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          cd /
          rm -f $PROBE
          bye
          EOF
