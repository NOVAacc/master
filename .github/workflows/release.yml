name: BOSH — проверка и публикация
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'resources/**'
      - 'routes/**'
      - 'public/**'
      - 'composer.*'
      - 'package*.json'
      - 'vite.config.js'
      - 'deploy/**'
      - 'tests/**'
      - '.github/workflows/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: bosh-release-pipeline
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: master_installer_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptesting"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, pdo_sqlite, pdo_mysql, zip
          coverage: none
      - name: Test safe release retention
        run: python3 deploy/test-prune-releases.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci --no-audit --no-fund
      - run: npm run check && npm run build
      - name: Prepare isolated test database
        run: php -r '(new PDO("mysql:host=127.0.0.1", "root", "testing"))->exec("CREATE DATABASE master_testing");'
      - run: php artisan test --compact
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: master_testing
          DB_USERNAME: root
          DB_PASSWORD: testing
      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Build private release archive
        run: |
          python3 deploy/build-release.py /tmp/release/master-server.zip --revision "$GITHUB_SHA"
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/release/master-server.zip') as z:
              names = z.namelist()
              assert '.env' not in names
              assert not any(n.startswith(('tests/', 'node_modules/', '.git/')) for n in names)
              assert 'database/seeders/DemoMastersSeeder.php' in names
              assert 'database/demo/profiles.json' in names
              assert all(f'database/demo/avatar-{i}.jpg' in names for i in range(9))
              assert 'vendor/autoload.php' in names
              assert 'public/build/manifest.json' in names
              assert 'public/index.php' in names
          PY
      - name: Test encrypted installer and rollback against disposable MySQL
        env:
          MASTER_DB_PASSWORD: testing
        run: python3 deploy/test-installation.py /tmp/release/master-server.zip --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: master-server-release
          path: /tmp/release/
          retention-days: 14

  publish:
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_USER: ${{ secrets.BOSH_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.BOSH_FTP_PASSWORD }}
      MASTER_DB_PASSWORD: ${{ secrets.MASTER_DB_PASSWORD }}
      NIKITA_OTP_API_KEY: ${{ secrets.nikita_api }}
      BOSH_SMTP_HOST: mail.bosh.kg
      BOSH_SMTP_PASSWORD: ${{ secrets.BOSH_SMTP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Select tested release
        id: source
        run: |
          set -euo pipefail
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          test -n "$MASTER_DB_PASSWORD"
          test -n "$NIKITA_OTP_API_KEY"
          echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: master-server-release
          path: /tmp/release
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl
          coverage: none
      - name: Inspect and prune obsolete generated releases
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          python3 - <<'PY'
          import hashlib, os, secrets, time
          from pathlib import Path
          token = secrets.token_hex(32)
          name = 'bosh-prune-' + secrets.token_hex(16) + '.php'
          script = Path('deploy/prune-releases.php.template').read_text()
          script = script.replace('__BASE__', '/home/n66843/master-app').replace('__TOKEN_HASH__', hashlib.sha256(token.encode()).hexdigest()).replace('__EXPIRES__', str(int(time.time()) + 1800))
          Path('/tmp/bosh-prune.php').write_text(script)
          Path('/tmp/bosh-prune-header.txt').write_text('X-Bosh-Cleanup: ' + token)
          Path('/tmp/bosh-prune-header.txt').chmod(0o600)
          Path('/tmp/bosh-prune-name.txt').write_text(name)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CLEANUP_NAME=' + name + '\n')
          PY
          CLEANUP_NAME=$(cat /tmp/bosh-prune-name.txt)
          timeout 60s lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://hostch01.fornex.org:21 <<EOF
          set cmd:fail-exit true
          set net:timeout 15
          set net:max-retries 1
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          cd /
          rm -f brand/bosh-icon-512.png
          put /tmp/bosh-prune.php -o $CLEANUP_NAME
          bye
          EOF
          curl --fail --silent --show-error --max-time 120 -H @/tmp/bosh-prune-header.txt -H 'Content-Type: application/json' --data '{"action":"inspect"}' "https://bosh.kg/$CLEANUP_NAME" -o /tmp/bosh-prune-plan.json
          cat /tmp/bosh-prune-plan.json
          curl --fail --silent --show-error --max-time 180 -H @/tmp/bosh-prune-header.txt -H 'Content-Type: application/json' --data '{"action":"prune"}' "https://bosh.kg/$CLEANUP_NAME" -o /tmp/bosh-prune-result.json
          cat /tmp/bosh-prune-result.json
          timeout 60s lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://hostch01.fornex.org:21 <<EOF
          set cmd:fail-exit true
          set net:timeout 15
          set net:max-retries 1
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          cd /
          put public/brand/bosh-icon-512.png -o brand/bosh-icon-512.png
          bye
          EOF
      - name: Verify new BOSH web root is writable using the dedicated FTP account
        run: |
          set -euo pipefail
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
          # Reject a misconfigured FTP chroot. A random probe must be accessible
          # from bosh.kg itself, NOT from the old edu.china.kg site.
          PROBE="bosh-deploy-probe-$(openssl rand -hex 16).txt"
          VALUE=$(openssl rand -hex 32)
          printf '%s' "$VALUE" > "/tmp/$PROBE"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          timeout 90s lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://hostch01.fornex.org:21 <<EOF
          set cmd:fail-exit true
          set net:timeout 20
          set net:max-retries 1
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          cd /
          put /tmp/$PROBE -o $PROBE
          bye
          EOF
          trap 'timeout 45s lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://hostch01.fornex.org:21 -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; rm -f $PROBE; bye" || true; rm -f "/tmp/$PROBE"' EXIT
          RECEIVED=$(curl --fail --silent --show-error --max-time 30 "https://bosh.kg/$PROBE")
          test "$RECEIVED" = "$VALUE"
          # Must NOT be the old site directory: keep both deployment roots separate.
          OLD_CODE=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "https://edu.china.kg/$PROBE")
          test "$OLD_CODE" != 200
      - name: Prepare encrypted, expiring installation
        run: |
          set -euo pipefail
          cd /tmp/release
          sha256sum --check master-server.zip.sha256
          cd "$GITHUB_WORKSPACE"
          python3 deploy/prepare-install.py /tmp/release/master-server.zip /tmp/master-install \
            --revision '${{ steps.source.outputs.sha }}' \
            --release '${{ steps.source.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}' \
            --url https://bosh.kg \
            --site-root /home/n66843/public_html/bosh.kg
          python3 - <<'PY'
          import json, os
          n = json.load(open('/tmp/master-install/names.json'))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('INSTALLER_NAME='+n['installer']+'\nUPLOAD_NAME='+n['upload']+'\n')
          PY
      - name: Upload encrypted release and one-time installer
        run: |
          set -euo pipefail
          timeout 180s lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://hostch01.fornex.org:21 <<EOF
          set cmd:fail-exit true
          set net:timeout 30
          set net:max-retries 1
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          cd /
          put /tmp/master-install/$UPLOAD_NAME -o $UPLOAD_NAME
          put /tmp/master-install/$INSTALLER_NAME -o $INSTALLER_NAME
          bye
          EOF
      - name: Install privately, back up database, migrate and activate
        run: |
          set -euo pipefail
          CODE=$(curl --silent --show-error --max-time 180 -w '%{http_code}' \
            -H @/tmp/master-install/auth-header.txt -H 'Content-Type: application/json' \
            --data-binary @/tmp/master-install/request.json \
            "https://bosh.kg/$INSTALLER_NAME" -o /tmp/install-result.json)
          cat /tmp/install-result.json
          test "$CODE" = 200
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/install-result.json'))['status'] == 'activated'
          PY
          echo 'APP_ACTIVATED=true' >> "$GITHUB_ENV"
      - name: Verify canonical BOSH URL after activation
        run: |
          set -euo pipefail
          for PAGE in login register up; do
            curl --fail --silent --show-error --max-time 30 "https://bosh.kg/$PAGE" -o "/tmp/bosh-new-$PAGE.html"
          done
          grep -q '/build/assets/' /tmp/bosh-new-login.html
          grep -q 'Auth' /tmp/bosh-new-login.html
          # Absolute links must now use the new canonical domain, not the old hostname.
          if grep -q 'https://edu.china.kg/m/' /tmp/bosh-new-login.html; then
            echo 'Old canonical hostname remains in generated links' >&2
            exit 1
          fi
          for ASSET in brand/bosh-mark.svg brand/bosh-social.png brand/bosh-icon-192.png brand/bosh-icon-512.png favicon.svg favicon.ico favicon-16.png favicon-32.png apple-touch-icon.png site.webmanifest; do
            curl --fail --silent --show-error --max-time 30 "https://bosh.kg/$ASSET" -o "/tmp/bosh-$(basename "$ASSET")"
          done
          for PRIVATE in .env vendor/autoload.php storage/logs/laravel.log; do
            CODE=$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' "https://bosh.kg/$PRIVATE")
            test "$CODE" = 403 || test "$CODE" = 404
          done
      - name: Keep only active and rollback releases after verification
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 180 -H @/tmp/bosh-prune-header.txt -H 'Content-Type: application/json' --data '{"action":"prune"}' "https://bosh.kg/$CLEANUP_NAME" -o /tmp/bosh-prune-after.json
          cat /tmp/bosh-prune-after.json
      - name: Roll back application if public verification failed
        if: failure() && env.APP_ACTIVATED == 'true'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 120 \
            -H @/tmp/master-install/auth-header.txt -H 'Content-Type: application/json' \
            --data-binary @/tmp/master-install/rollback.json "https://bosh.kg/$INSTALLER_NAME"
      - name: Remove installer and encrypted upload
        if: always() && env.INSTALLER_NAME != ''
        run: |
          set -euo pipefail
          timeout 90s lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://hostch01.fornex.org:21 <<EOF
          set cmd:fail-exit true
          set net:timeout 15
          set net:max-retries 1
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          cd /
          rm -f $INSTALLER_NAME
          rm -f $UPLOAD_NAME
          bye
          EOF
          rm -rf /tmp/master-install
      - name: Remove temporary release cleanup endpoint
        if: always() && env.CLEANUP_NAME != ''
        run: |
          set -euo pipefail
          timeout 60s lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://hostch01.fornex.org:21 <<EOF
          set cmd:fail-exit true
          set net:timeout 15
          set net:max-retries 1
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          cd /
          rm -f $CLEANUP_NAME
          bye
          EOF
          rm -f /tmp/bosh-prune.php /tmp/bosh-prune-header.txt
