name: BOSH production verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Inspect latest main release and production deployment runs
        run: |
          gh api "repos/$GH_REPO/actions/runs?branch=main&per_page=12" --jq '.workflow_runs[] | "RECENT_RUN id=\\(.id) name=\\(.name) status=\\(.status) conclusion=\\(.conclusion) sha=\\(.head_sha)"'
      - name: Verify BOSH frontend and health endpoint
        run: |
          set -euo pipefail
          for PAGE in / /login /register /up; do
            CODE=$(curl --silent --show-error --max-time 20 -o /tmp/bosh-page -w '%{http_code}' "https://bosh.kg$PAGE" || true)
            echo "BOSH_PAGE=$PAGE HTTP_STATUS=$CODE"
            if test "$PAGE" = "/login"; then
              if grep -q '/build/assets/' /tmp/bosh-page && grep -q Auth /tmp/bosh-page; then
                echo "BOSH_LOGIN_APPLICATION_FOUND"
              else
                echo "BOSH_LOGIN_APPLICATION_NOT_FOUND"
              fi
            fi
          done
