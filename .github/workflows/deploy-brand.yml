name: Publish BOSH brand assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/brand/**'
      - 'public/favicon*'
      - 'public/apple-touch-icon.png'
      - 'public/site.webmanifest'
      - '.github/workflows/deploy-brand.yml'
permissions:
  contents: read
concurrency:
  group: bosh-brand-assets
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_USER: ${{ secrets.BOSH_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.BOSH_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish fixed public branding files
        run: |
          set -euo pipefail
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          timeout 30s lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://hostch01.fornex.org:21 <<EOF
          set net:timeout 15
          set net:max-retries 1
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          quote SITE QUOTA
          bye
          EOF
          timeout 120s lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://hostch01.fornex.org:21 <<EOF
          set cmd:fail-exit true
          set net:timeout 20
          set net:max-retries 1
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          cd /
          mkdir -p brand
          mput -O brand public/brand/*
          put public/favicon.svg -o favicon.svg
          put public/favicon.ico -o favicon.ico
          put public/favicon-16.png -o favicon-16.png
          put public/favicon-32.png -o favicon-32.png
          put public/apple-touch-icon.png -o apple-touch-icon.png
          put public/site.webmanifest -o site.webmanifest
          bye
          EOF
      - name: Verify published logo and icons match the repository
        if: always()
        run: |
          set -euo pipefail
          for ASSET in brand/bosh-mark.svg brand/bosh-social.png brand/bosh-icon-192.png brand/bosh-icon-512.png favicon.svg favicon.ico favicon-16.png favicon-32.png apple-touch-icon.png site.webmanifest; do
            curl --fail --silent --show-error --max-time 30 "https://bosh.kg/$ASSET?verify=$GITHUB_SHA" -o /tmp/bosh-brand-check
            cmp "public/$ASSET" /tmp/bosh-brand-check
          done
