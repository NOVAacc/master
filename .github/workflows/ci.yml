name: Application checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: master_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptesting"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci --no-audit --no-fund
      - run: npm run check && npm run build
      - run: php artisan test --compact
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: master_testing
          DB_USERNAME: root
          DB_PASSWORD: testing
      - name: Verify migration rollback and re-apply on disposable MySQL 5.7
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --step=5 --force
          php artisan migrate --force
          php artisan bosh:audit-bookings
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: master_testing
          DB_USERNAME: root
          DB_PASSWORD: testing
      - name: Test two independent PHP processes claiming last group seat
        run: php tests/integration/group-seat-race.php
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: master_testing
          DB_USERNAME: root
          DB_PASSWORD: testing
      - uses: actions/upload-artifact@v4
        with:
          name: master-frontend-build
          path: public/build/
